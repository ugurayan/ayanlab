server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /ayanlabs/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    location /actuator/ {
        proxy_pass http://127.0.0.1:8081;
    }

    location /swagger-ui {
        proxy_pass http://127.0.0.1:8081;
    }

    location /v3/ {
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}