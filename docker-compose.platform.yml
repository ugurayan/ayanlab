# Platform stack: Postgres + Redis + ayanlab-platform-backend + UI
# ENV=local ./scripts/up-platform.sh
# Postgres: named volumes + baked-in init (avoids macOS Podman virtiofs bind-mount failures).

services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    image: ayanlab-postgres:16-3.4
    container_name: ayanlab-postgres
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-ayanlab_super}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-change-me-super}
      POSTGRES_DB: postgres
      TZ: ${TZ:-America/Los_Angeles}
    ports:
      - "${AYANLAB_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ayanlab_platform_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -q"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ayanlab_internal

  redis:
    image: redis:7-alpine
    container_name: ayanlab-redis
    restart: unless-stopped
    ports:
      - "${AYANLAB_REDIS_HOST_PORT:-6380}:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    volumes:
      - ayanlab_platform_redis_data:/data
    networks:
      - ayanlab_internal

  ayanlab-platform-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        BACKEND_DIR: ayanlab-platform/ayanlab-platform-backend
    container_name: ayanlab-platform-backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      POSTGIS_HOST: postgres
      POSTGIS_PORT: 5432
      POSTGIS_DB: ${PLATFORM_DB_NAME}
      POSTGIS_USER: ${PLATFORM_DB_USER}
      POSTGIS_PASSWORD: ${PLATFORM_DB_PASSWORD}
      POSTGIS_SCHEMA: ${PLATFORM_DB_SCHEMA:-core}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8080
    ports:
      - "8102:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ayanlab_internal

  ayanlab-platform-ui:
    build:
      context: ./ayanlab-platform/ayanlab-platform-ui
      dockerfile: Dockerfile
    container_name: ayanlab-platform-ui
    restart: unless-stopped
    ports:
      - "3102:80"
    networks:
      - ayanlab_internal

volumes:
  ayanlab_platform_pg_data:
  ayanlab_platform_redis_data:

networks:
  ayanlab_internal:
    name: ayanlab_internal
    driver: bridge