# Attach to shared infra: docker compose -f docker/docker-compose.infra.yml up -d

services:
  ayanlab_comm_backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        BACKEND_DIR: ayanlab-comm/ayanlab-comm-backend
    container_name: ayanlab-comm-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGIS_HOST: postgres
      POSTGIS_PORT: 5432
      POSTGIS_DB: ${POSTGRES_DB:-ayanLabs}
      POSTGIS_USER: ${POSTGRES_USER:-ayanlab}
      POSTGIS_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGIS_SCHEMA: core
      KAFKA_SERVERS: kafka:9092

  ayanlab_comm_ui:
    build:
      context: ./ayanlab-comm-ui
      dockerfile: Dockerfile
    container_name: ayanlab-comm-ui
    restart: unless-stopped
    ports:
      - "3108:80"
    networks:
      - ayanlab_internal

networks:
  ayanlab_internal:
    external: true
    name: ayanlab_internal
