# Attach to shared infra: docker compose -f docker/docker-compose.infra.yml up -d

services:
  ayanlab_vault_backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        BACKEND_DIR: ayanlab-vault/ayanlab-vault-backend
    container_name: ayanlab-vault-backend
    restart: unless-stopped
    env_file:
      - ../${ENV_FILE:-.env.local}
    environment:
      POSTGIS_HOST: postgres
      POSTGIS_PORT: 5432
      POSTGIS_DB: ${POSTGRES_DB:-ayanLabs}
      POSTGIS_USER: ${POSTGRES_USER:-ayanlab}
      POSTGIS_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGIS_SCHEMA: vault
      KAFKA_SERVERS: kafka:9092

  ayanlab_vault_ui:
    build:
      context: ./ayanlab-vault-ui
      dockerfile: Dockerfile
    container_name: ayanlab-vault-ui
    restart: unless-stopped
    ports:
      - "3103:80"
    networks:
      - ayanlab_internal

networks:
  ayanlab_internal:
    external: true
    name: ayanlab_internal
