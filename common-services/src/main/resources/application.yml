spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true

twilio:
  accountSid: ${TWILIO_ACCOUNT_SID:}
  authToken: ${TWILIO_AUTH_TOKEN:}
  fromNumber: ${TWILIO_FROM_NUMBER:}

gcp:
  projectId: ${GCP_PROJECT_ID:}
  credentialsPath: ${GOOGLE_APPLICATION_CREDENTIALS:}

kafka:
  bootstrapServers: ${KAFKA_SERVERS:localhost:9092}
  consumer:
    groupId: ${KAFKA_GROUP_ID:ayanlabs-group}

ayanlabs:
  common:
    defaultBucket: ${GCP_BUCKET:ayanlabs-common-bucket}

