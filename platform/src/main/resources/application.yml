spring:
  application:
    name: ayanlabs-platform

  # Flyway is not on the classpath; keep migrations off so schema stays Hibernate-only.
  flyway:
    enabled: false

  datasource:
    # Prefer a full POSTGIS_URL if provided; otherwise build from host/port/db and currentSchema
    url: ${POSTGIS_URL:jdbc:postgresql://${POSTGIS_HOST:147.93.138.158}:${POSTGIS_PORT:5432}/${POSTGIS_DB:ayanLabs}?currentSchema=${POSTGIS_SCHEMA:core}}
    username: ${POSTGIS_USER:core}
    password: ${POSTGIS_PASSWORD:UgurAyanLabs9602.}
    driver-class-name: org.postgresql.Driver

  # Tables are created/updated by Hibernate from JPA entities (no Flyway SQL migrations).
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        default_schema: ${POSTGIS_SCHEMA:core}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        globally_quoted_identifiers: true
    show-sql: false
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Document Postgres/PostGIS environment variables and defaults for the platform
postgis:
  host: ${POSTGIS_HOST:147.93.138.158}
  port: ${POSTGIS_PORT:5432}
  database: ${POSTGIS_DB:ayanLabs}
  schema: core
  user: ${POSTGIS_USER:core}
  # NOTE: prefer passing sensitive values via environment variables
  password: ${POSTGIS_PASSWORD:UgurAyanLabs9602.}
  # Optional: comma-separated list of schemas to ensure/create at startup
  schemas: core,ipms,crm,vault, staffiq

ayanlabs:
  # all in seconds; defaults: 1 day for web, 15 days for mobile, 60 days for refresh tokens
  jwt:
    secret: ${JWT_SECRET:ayanLabs-ElifBozkurtAyan-9602-!@#$%^&*()-MadeByLove}
    access-token-expiry-for-web: ${JWT_ACCESS_TOKEN_EXPIRY_WEB:86400}
    access-token-expiry-for-mobile: ${JWT_ACCESS_TOKEN_EXPIRY_MOBILE:1296000}
    refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:5184000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

# Seed data: default-data.json (core security model) then DemoDataLoader (remaining entities).
platform:
  db:
    load-default-data: true
    load-demo-data: true
