# Root orchestrator: infra + optional product profiles.
# Usage:
#   docker compose up -d                    # infra only (default)
#   docker compose --profile auth up -d     # infra + ayanlab-platform

include:
  - path: docker/docker-compose.infra.yml

# Product stacks live in their own compose files; root delegates via profiles script.
# See scripts/publish-vps.sh and docs/DEPLOY.md